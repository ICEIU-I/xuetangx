name: xuetangx-go
services:
  postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: xuetangx
      POSTGRES_USER: xuetangx
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U xuetangx -d xuetangx"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  app:
    image: xuetangx-go:${RELEASE:-latest}
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      CREDENTIAL_KEY_FILE: /run/secrets/credential_keys.json
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set HTTPS public origin}
      MAIL_ENABLED: "false"
      LISTEN_ADDR: 0.0.0.0:8788
      TRAFFIC_FILE: /var/lib/xuetangx/page-traffic.json
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?set exact trusted proxy CIDRs}
    secrets: [database_url, credential_keys.json]
    volumes: [app-metrics:/var/lib/xuetangx]
    ports: ["127.0.0.1:18788:8788"]
    networks: [backend, edge]
    healthcheck:
      test: [CMD, /xuetangx, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  tunnel:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run]
    depends_on:
      app: {condition: service_healthy}
    volumes: [./tunnel.yml:/etc/cloudflared/config.yml:ro]
    secrets: [tunnel_credentials]
    networks:
      edge: {ipv4_address: "${TUNNEL_IP:?set TUNNEL_IP}"}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
networks:
  backend: {internal: true}
  edge:
    ipam:
      config: [{subnet: "${EDGE_SUBNET:?set EDGE_SUBNET}"}]
volumes: {postgres-data: {}, app-metrics: {}}
secrets:
  postgres_password: {file: ./secrets/postgres_password}
  database_url: {file: ./secrets/database_url}
  credential_keys.json: {file: ./secrets/credential_keys.json}
  tunnel_credentials: {file: ./secrets/tunnel.json}
